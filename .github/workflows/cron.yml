name: Scheduled jobs

# Vercel's free plan runs crons at most daily, so the hourly reminder job is
# triggered from here. Needs repository secrets APP_URL (e.g.
# https://slotwise.vercel.app) and CRON_SECRET (same value as on Vercel).

on:
  schedule:
    - cron: "7 * * * *" # hourly: reminders + expire lapsed holds
    - cron: "17 3 * * *" # 03:17 UTC daily: reset the demo account
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [reminders, reset-demo]
        default: reminders

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Call the app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ github.event.inputs.job || (github.event.schedule == '17 3 * * *' && 'reset-demo') || 'reminders' }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_URL or CRON_SECRET secret not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/$JOB"
